name: discover-route
on:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "requests>=2.31" "playwright>=1.44"
          python -m playwright install --with-deps chromium
      - run: python discover_route.py
