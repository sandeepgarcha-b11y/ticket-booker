name: twickets-event

# Watches a single Twickets EVENT (/en/event/<id>) for resale listings and
# alerts via Telegram with a one-tap link.
#
# Continuous coverage: GitHub's cron is unreliable here (the old "*/5" schedule
# actually fired only every 1-3 hours), so each run polls for ~5h45m and then
# dispatches the next run itself. The cron below is only a backstop that
# restarts the chain if it ever breaks.
#
# To stop it: set repo variable TWICKETS_EVENT_CHAIN=off (stops after the
# current run), cancel the running run, or Actions -> twickets-event -> Disable.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Diagnostic run: print findings, do not notify/persist"
        type: boolean
        default: false
      test:
        description: "Send a Telegram test message confirming the watcher is live"
        type: boolean
        default: false
      find_tour:
        description: "Print the tour id/title found on the public event page"
        type: boolean
        default: false
      event_id:
        description: "(debug/find_tour only) override the event id for this run"
        type: string
        default: ""
      find_url:
        description: "(find_tour only) a Twickets page or twckts.com short link to inspect"
        type: string
        default: ""

permissions:
  contents: write
  actions: write             # to dispatch the next run in the chain

concurrency:
  group: twickets-event
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Record start time
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install "requests>=2.31"
      - name: Watch
        id: watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWICKETS_EVENT_ID: ${{ inputs.event_id || vars.TWICKETS_EVENT_ID || '2053116298883239936' }}
          TWICKETS_TOUR_ID: ${{ vars.TWICKETS_EVENT_TOUR_ID || '2116192548476166144' }}
          SHOW_NAME: ${{ vars.TWICKETS_EVENT_NAME || 'Bicep, Royal Albert Hall' }}
          FIND_URL: ${{ inputs.find_url }}
          STATE_PATH: twickets_event_state.json
          DEBUG: ${{ inputs.debug && '1' || '' }}
          MODE: ${{ inputs.find_tour && 'find-tour' || (inputs.test && 'test' || '') }}
          POLL_INTERVAL: ${{ vars.TWICKETS_POLL_INTERVAL || '12' }}
          LOOP_DURATION: ${{ (inputs.debug || inputs.test || inputs.find_tour) && '0' || vars.TWICKETS_EVENT_LOOP_SECONDS || '20700' }}
        run: python twickets.py
      - name: Persist state
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.debug && !inputs.test && !inputs.find_tour) }}
        run: |
          if [ -f twickets_event_state.json ] && [ -n "$(git status --porcelain twickets_event_state.json)" ]; then
            git config user.name "ticket-poller[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add twickets_event_state.json
            git commit -m "Update twickets event state [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "::warning::state push failed; continuing"
          else
            echo "twickets_event_state.json unchanged"
          fi
      - name: Start next run (continuous watching)
        if: ${{ !cancelled() && steps.watch.outcome == 'success' && vars.TWICKETS_EVENT_CHAIN != 'off' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.debug && !inputs.test && !inputs.find_tour)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Safety: never chain faster than every 5 minutes, even if the watch
          # loop exited early for some reason.
          elapsed=$(( $(date +%s) - START_TS ))
          if [ "$elapsed" -lt 300 ]; then sleep $(( 300 - elapsed )); fi
          gh workflow run twickets-event.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "next run dispatched"
